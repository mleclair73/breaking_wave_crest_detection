version: 1
common_config: ablation/configs/common.yaml
output_root: outputs
models:
  - {config: ablation/configs/unet.yaml, table: true}
  - {config: ablation/configs/attention_unet.yaml, table: true}
  - {config: ablation/configs/deeplabv3plus.yaml, table: true}
  - {config: ablation/configs/swin_unet.yaml, table: true, ood: true, ood_comparison: true}
  - {config: ablation/configs/segnext_t_vanilla.yaml, table: true}
  - {config: ablation/configs/segnext_t_learned_up.yaml, table: true}
  - {config: ablation/configs/segnext_t_learned_up_skip_4.yaml, table: true}
  - config: ablation/configs/segnext_t_learned_up_skip_4_2.yaml
    table: true
    augmentation_role: augmented
    missing_data: true
    ood: true
    ood_comparison: true
    operating_points: true
    holdout_test: true
    training_priority: true
  - config: ablation/configs/segnext_t_learned_up_skip_4_2_no_aug.yaml
    table: false
    augmentation_role: no_augmentation
    missing_data: true
    ood: true
