[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breaking-wave-crest-detection"
version = "0.1.0"
description = "Breaking-wave crest detection: SegNeXt segmentation and DUNEX wave-speed pipeline."
requires-python = ">=3.12"
dependencies = [
    # Core (torch>=2.3 is required for torch.amp.GradScaler).
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "numpy>=1.24.0",
    # Image processing.
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0,<5",
    "scipy>=1.10.0",
    "scikit-image>=0.24.0",
    # Tabular and gridded pipeline I/O.
    "pandas>=2.0.0",
    "xarray>=2024.11.0",
    "netCDF4>=1.7.0",
    "dask>=2024.11.0",
    # Model architecture.
    "einops>=0.7.0",
    "timm>=1.0.0",
    "segmentation-models-pytorch>=0.4.0",
    "fvcore>=0.1.5.post20221221",
    # Visualization and logging.
    "matplotlib>=3.7.0",
    "tensorboard>=2.13.0",
    # Configuration and progress.
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
# Manuscript figures and exploratory analysis are not installed on CUDA
# training pods. They remain locked and are available with `uv sync --locked
# --extra analysis` or the compatibility requirements.txt.
analysis = [
    "bottleneck>=1.3.0",  # xarray ffill/push backend
    "cmocean>=4.0.0",
    "joblib>=1.4.0",
    "pvlib>=0.11.0",
    "scikit-learn>=1.5.0",
]
acquisition = [
    "cdsapi>=0.7.7,<0.8",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8,<0.17",
]

[tool.setuptools]
# `model/` remains the import root for the maintained flat-layout code. Keep
# this list explicit so test, output, and historical directories cannot be
# included in wheels accidentally.
package-dir = {"" = "model", utils = "utils"}
py-modules = [
    "augmentations",
    "calculate_wave_speeds",
    "checkpoint",
    "dataset",
    "dunex_paths",
    "losses",
    "tiling",
    "train",
]
packages = [
    "ablation",
    "ablation.configs",
    "ablation.manifests",
    "common",
    "metrics",
    "models",
    "segmentation",
    "utils",
]

[tool.setuptools.package-data]
ablation = ["*.yaml", "configs/*.yaml", "manifests/*.yaml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Keep the permanent lint baseline intentionally small: syntax errors,
# undefined names, and unused imports/variables.
select = ["E9", "F"]
